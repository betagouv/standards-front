fr:
  global:
    sponsor: "République\nFrançaise"
    service_name: "Les standards de beta.gouv.fr"
    service_description: "Pour aider les équipes à créer de meilleurs services publics"
  feedback:
    title: Retour sur la question %{title}
    body: |
      ## Contexte

      * Question : %{title}
      * Lien : [%{path}](%{link})

      ## Problème

      Décrivez ici toute incompréhension, erreur, coquille ou incertitude que vous avez rencontré avec le standard...

  sessions:
    destroy:
      success: Déconnexion terminée.
    create:
      success:
        title: Connexion réussie pour %{email}
      user_not_found:
        title: Impossible de trouver un compte avec l'email %{email}
        text: |
          Dans la majorité des cas c'est une adresse en
          `@beta.gouv.fr` qui permet de faire le lien avec
          l'Espace-Membre. Essayez de [vous connecter à
          l'Espace-Membre (s'ouvre dans un nouvel
          onglet)](https://espace-membre.incubateur.net/){:target="_blank"}
          pour vérifier l'email qui vous est associé.
